name: wc-bundle-size

on:
  workflow_call:
    inputs:
      issue-number:
        description: 'The PR number'
        required: true
        type: number
      build-command:
        description: 'Command that produces the bundle'
        required: false
        type: string
        default: 'pnpm bundle'
      artifact-dir:
        description: 'Directory containing the built UMD assets (relative to repo root)'
        required: false
        type: string
        default: 'dist/umd'
      js-file:
        description: 'Minified JS filename to measure'
        required: false
        type: string
        default: 'clera-ui.min.js'
      css-file:
        description: 'Minified CSS filename to measure'
        required: false
        type: string
        default: 'clera-ui.min.css'
    secrets:
      GH_TOKEN:
        description: 'Deprecated — the built-in GITHUB_TOKEN is used for PR comments. Kept optional for backward compatibility.'
        required: false

permissions:
  pull-requests: write
  contents: read

jobs:
  analyze-bundle:
    name: analyze bundle size
    runs-on: ubuntu-latest
    outputs:
      comment-body: ${{ steps.format_comment.outputs.body }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup
        uses: itsferdiardiansa/ci-toolbox/actions/setup-node@v1.0.0

      - name: Build PR branch
        run: ${{ inputs.build-command }}

      - name: Get PR branch file sizes
        run: |
          echo "PR_JS_SIZE=$(ls -l ${{ inputs.artifact-dir }}/${{ inputs.js-file }} | awk '{print $5}' || echo "0")" >> $GITHUB_ENV
          echo "PR_CSS_SIZE=$(ls -l ${{ inputs.artifact-dir }}/${{ inputs.css-file }} | awk '{print $5}' || echo "0")" >> $GITHUB_ENV

      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup
        uses: itsferdiardiansa/ci-toolbox/actions/setup-node@v1.0.0
      
      - name: Build main branch
        run: ${{ inputs.build-command }}

      - name: Get main branch file sizes
        run: |
          echo "MAIN_JS_SIZE=$(ls -l ${{ inputs.artifact-dir }}/${{ inputs.js-file }} | awk '{print $5}' || echo "0")" >> $GITHUB_ENV
          echo "MAIN_CSS_SIZE=$(ls -l ${{ inputs.artifact-dir }}/${{ inputs.css-file }} | awk '{print $5}' || echo "0")" >> $GITHUB_ENV
      
      - name: Format comment body
        id: format_comment
        run: |
          PR_JS=$((${PR_JS_SIZE:-0} / 1000))
          PR_CSS=$((${PR_CSS_SIZE:-0} / 1000))
          MAIN_JS=$((${MAIN_JS_SIZE:-0} / 1000))
          MAIN_CSS=$((${MAIN_CSS_SIZE:-0} / 1000))
          DIFF_JS=$((${PR_JS_SIZE:-0} - ${MAIN_JS_SIZE:-0}))
          DIFF_CSS=$((${PR_CSS_SIZE:-0} - ${MAIN_CSS_SIZE:-0}))
          {
            echo 'body<<EOF'
            echo '## 📦 Bundle Size Report'
            echo ''
            echo '| File | main | PR | Change |'
            echo '| :--- | ---: | ---: | ---: |'
            echo "| \`${{ inputs.js-file }}\` | \`$MAIN_JS kB\` | \`$PR_JS kB\` | \`$DIFF_JS B\` |"
            echo "| \`${{ inputs.css-file }}\` | \`$MAIN_CSS kB\` | \`$PR_CSS kB\` | \`$DIFF_CSS B\` |"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
  
  comment-pr:
    name: comment-pr
    runs-on: ubuntu-latest
    needs: analyze-bundle
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Post or Update Comment
        uses: itsferdiardiansa/ci-toolbox/actions/post-comment@v1.0.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ inputs.issue-number }}
          comment-id: bundle-size-report
          body: ${{ needs.analyze-bundle.outputs.comment-body }}